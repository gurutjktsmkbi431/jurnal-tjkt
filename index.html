<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jurnal Guru TJKT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#EBF0F3;--surface:#FFFFFF;--s2:#F3F6F8;--ink:#10202E;--mut:#566877;--line:#D2DBE2;
  --brand:#0B5C6B;--brand-h:#094A57;--onbrand:#FFFFFF;--acc:#E8590C;--accbg:#FDE9DA;
  --ok:#1B7A44;--okbg:#DCF2E4;--warn:#8F5A00;--warnbg:#FFEFC9;--bad:#B3261E;--badbg:#FBDCD9;--info:#215DA6;--infobg:#DDEAF9;
  --rail:#0D2230;--railink:#C5D5E0;--railact:#14354A;--c1:#0E8FA3;--c2:#5B6FD6;--c3:#9B59B6;--c4:#C77D14;
  --r:10px;--sh:0 1px 2px rgba(16,32,46,.07),0 4px 14px rgba(16,32,46,.04);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B151D;--surface:#13222D;--s2:#192B38;--ink:#E5EDF3;--mut:#93A6B5;--line:#263A4A;
    --brand:#2FA6BA;--brand-h:#4BB9CC;--onbrand:#04202A;--acc:#FF8B4A;--accbg:#3A2417;
    --ok:#5ED08B;--okbg:#14301F;--warn:#F2B84B;--warnbg:#352809;--bad:#FF8A80;--badbg:#3B1A18;--info:#7DB4F0;--infobg:#152A41;
    --rail:#07111A;--railink:#A9BDCB;--railact:#112B3C;--c1:#35BFD3;--c2:#8E9CF0;--c3:#C58BDB;--c4:#E5A23C;
    --sh:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#0B151D;--surface:#13222D;--s2:#192B38;--ink:#E5EDF3;--mut:#93A6B5;--line:#263A4A;
  --brand:#2FA6BA;--brand-h:#4BB9CC;--onbrand:#04202A;--acc:#FF8B4A;--accbg:#3A2417;
  --ok:#5ED08B;--okbg:#14301F;--warn:#F2B84B;--warnbg:#352809;--bad:#FF8A80;--badbg:#3B1A18;--info:#7DB4F0;--infobg:#152A41;
  --rail:#07111A;--railink:#A9BDCB;--railact:#112B3C;--c1:#35BFD3;--c2:#8E9CF0;--c3:#C58BDB;--c4:#E5A23C;
  --sh:0 1px 2px rgba(0,0,0,.4);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque","Plus Jakarta Sans",system-ui,sans-serif;margin:0;letter-spacing:-.01em;line-height:1.15}
h1{font-size:28px;font-weight:700}h2{font-size:19px;font-weight:700}h3{font-size:16px;font-weight:600}
p{margin:0}button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:4px}
.mut{color:var(--mut)}.sm{font-size:13px}.nowrap{white-space:nowrap}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* layout */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.rail{background:var(--rail);color:var(--railink);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:18px 12px;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 18px}
.brand b{display:block;font:700 18px/1.1 "Bricolage Grotesque",sans-serif;color:#fff}
.brand small{color:var(--railink);font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;background:none;border:0;color:var(--railink);padding:9px 12px;border-radius:8px;cursor:pointer;text-align:left;font-weight:500;position:relative}
.nav button:hover{background:var(--railact);color:#fff}
.nav button[aria-current="page"]{background:var(--railact);color:#fff;font-weight:700}
.nav button[aria-current="page"]::before{content:"";position:absolute;left:-12px;top:50%;width:12px;height:3px;margin-top:-1.5px;background:var(--acc);border-radius:0 2px 2px 0}
.nav button[aria-current="page"]::after{content:"";position:absolute;right:10px;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;background:var(--acc)}
.who{margin-top:auto;padding:14px 10px 4px;border-top:1px solid #ffffff1f;font-size:13px}
.who b{color:#fff;display:block}
.main{padding:0 28px 60px;min-width:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:14px 0 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:22px}
.top .sel{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:0 10px}
.top .sel span{color:var(--mut);font-size:13px}
.top select{border:0;background:none;padding:8px 2px;font-weight:600;cursor:pointer}
.top .sp{flex:1}
.stat{font-size:13px;color:var(--mut);display:flex;align-items:center;gap:6px}
.stat i{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.stat.busy i{background:var(--warn)}.stat.err i{background:var(--bad)}

/* controls */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:600;font-size:14px;line-height:1.2;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--onbrand)}
.btn.primary:hover{background:var(--brand-h);color:var(--onbrand)}
.btn.acc{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.danger{color:var(--bad)}.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.ghost{background:none}
.icon-btn{border:0;background:none;padding:6px;border-radius:7px;cursor:pointer;color:var(--mut);display:inline-flex}
.icon-btn:hover{background:var(--s2);color:var(--ink)}
input[type=text],input[type=number],input[type=date],input[type=url],select,textarea,input:not([type]){width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-width:0}
textarea{resize:vertical;line-height:1.45}
input:focus,select:focus,textarea:focus{border-color:var(--brand)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:18px}
.pg-h{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-bottom:18px}
.lead{color:var(--mut);max-width:62ch;margin-top:6px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:9px 14px;cursor:pointer;font-weight:600;color:var(--mut);white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--acc)}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--s2);border:1px solid var(--line);border-radius:99px;padding:2px 10px;font-size:12.5px;font-weight:600;color:var(--ink);text-decoration:none}
.chip.ok{background:var(--okbg);border-color:transparent;color:var(--ok)}
.chip.warn{background:var(--warnbg);border-color:transparent;color:var(--warn)}
.chip.bad{background:var(--badbg);border-color:transparent;color:var(--bad)}
.chip.info{background:var(--infobg);border-color:transparent;color:var(--info)}
button.chip{cursor:pointer}button.chip:hover,a.chip:hover{border-color:var(--brand)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.empty{padding:34px 20px;text-align:center;color:var(--mut)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.empty .btn{margin-top:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.list{display:flex;flex-direction:column;gap:12px}
.item{padding:16px 18px}
.item header{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.item h3{margin-bottom:4px}
.item .body{margin-top:8px;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;color:var(--ink)}
.item .foot{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.acts{display:flex;gap:2px;flex:none}

/* tables */
.tw{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%}
.tbl th,.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{background:var(--s2);font-weight:700;font-size:13px;white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
.grid{font-size:13px}
.grid th,.grid td{border:1px solid var(--line);padding:0;text-align:center;background:var(--surface)}
.grid thead th{background:var(--s2);font-weight:600;padding:4px 6px;white-space:nowrap}
.grid .nm{text-align:left;padding:5px 10px;white-space:nowrap}
.grid .no{width:40px;min-width:40px;color:var(--mut)}
.grid .stk{position:sticky;left:0;z-index:2;background:var(--surface)}
.grid .stk2{position:sticky;left:40px;z-index:2;background:var(--surface);min-width:210px;max-width:240px;overflow:hidden;text-overflow:ellipsis}
.grid thead .stk,.grid thead .stk2{background:var(--s2);z-index:3}
.grid .rc{min-width:38px;padding:0 4px;font-variant-numeric:tabular-nums}
.grid tfoot td{background:var(--s2);font-weight:600;padding:4px}
.grid .hb{background:none;border:0;cursor:pointer;font-weight:700;padding:3px 6px;border-radius:5px;color:var(--brand)}
.grid .hb:hover{background:var(--infobg)}
.mk{width:100%;min-width:42px;height:32px;border:0;background:none;cursor:pointer;font-weight:700;font-size:13px;color:var(--mut)}
.mk:hover{background:var(--s2)}
.mk-H{background:var(--okbg);color:var(--ok)}.mk-S{background:var(--infobg);color:var(--info)}
.mk-I{background:var(--warnbg);color:var(--warn)}.mk-A{background:var(--badbg);color:var(--bad)}
.mk-D{background:var(--accbg);color:var(--acc)}
.sc{width:68px;border:0;border-radius:0;text-align:center;padding:7px 4px;background:transparent}
.sc:focus{background:var(--infobg);outline:0;box-shadow:inset 0 0 0 2px var(--brand)}
.sc.low{color:var(--bad);font-weight:700}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--mut);margin:0 0 10px}
.legend span b{display:inline-block;min-width:22px;text-align:center;border-radius:5px;padding:0 4px;margin-right:4px}

/* beranda */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.4fr);gap:20px;align-items:start;margin-bottom:22px}
.hello{color:var(--mut);font-weight:500}
.hero h1{margin:4px 0 6px}
.sesi{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;padding:14px 16px;border-left:5px solid var(--c1);margin-bottom:10px}
.sesi.k2{border-left-color:var(--c2)}.sesi.k3{border-left-color:var(--c3)}.sesi.k4{border-left-color:var(--c4)}
.sesi.now{box-shadow:0 0 0 2px var(--acc)}.sesi.past{opacity:.82}
.sesi .jam{font:700 22px/1 "Bricolage Grotesque",sans-serif;grid-row:span 2;align-self:center;min-width:54px}
.sesi .jam small{display:block;font:500 12px/1.3 "Plus Jakarta Sans",sans-serif;color:var(--mut);margin-top:3px}
.sesi .btns{grid-column:2;display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.panel{padding:18px}
.prow{display:grid;grid-template-columns:62px 1fr;gap:10px;align-items:center;padding:6px 8px;border-radius:9px}
.prow.today{background:var(--accbg)}
.prow>b{font-size:13px}
.ports{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:3px}
.port{height:26px;border-radius:5px;background:var(--s2);border:1px solid var(--line);font-size:11px;color:var(--mut);display:flex;align-items:center;justify-content:center;font-weight:700}
.port.off{background:none;border-style:dashed;opacity:.35}
.port.on{border-color:transparent;color:#fff;background:var(--c1)}
.port.on.k2{background:var(--c2)}.port.on.k3{background:var(--c3)}.port.on.k4{background:var(--c4)}
.port.on.first{border-radius:5px 0 0 5px;margin-right:-3px}.port.on.last{border-radius:0 5px 5px 0}.port.on.mid{border-radius:0;margin-right:-3px}.port.on.first.last{border-radius:5px;margin-right:0}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:22px 0}
.fact{padding:14px 16px}.fact b{display:block;font:700 24px/1.1 "Bricolage Grotesque",sans-serif}.fact span{color:var(--mut);font-size:13px}
.todo-row{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.todo-row:last-child{border-bottom:0}

/* modal */
.mwrap{position:fixed;inset:0;background:rgba(7,17,26,.55);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:max(20px,env(safe-area-inset-top,0px)) 14px 20px;overflow:auto}
.mwrap[hidden]{display:none}
.modal{background:var(--surface);border-radius:14px;width:min(560px,100%);box-shadow:0 20px 60px rgba(0,0,0,.35);margin:auto 0;display:flex;flex-direction:column;max-height:calc(100vh - 40px)}
.modal.wide{width:min(820px,100%)}
.modal>header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.mbody{padding:18px 20px;overflow:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.modal>footer{display:flex;gap:10px;padding:14px 20px;border-top:1px solid var(--line);justify-content:flex-end;align-items:center}
.modal>footer .left{margin-right:auto}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.full,.fldbox.full{grid-column:1/-1}
.fld>span,.fldbox>.lb{font-weight:600;font-size:13.5px}
.fld small{color:var(--mut)}
.req{color:var(--bad)}
.infobox{grid-column:1/-1;background:var(--s2);border:1px dashed var(--line);border-radius:9px;padding:10px 12px;font-size:13.5px;display:flex;flex-direction:column;gap:8px}
.lamp{border:1px solid var(--line);border-radius:9px;padding:12px;background:var(--s2)}
.lamp .chips{margin-bottom:10px}
.lamp .adds{display:grid;grid-template-columns:auto 1fr 1.4fr auto;gap:8px;align-items:center}
.lamp input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
.lamp label.btn{margin:0}
.chk{display:flex;gap:9px;align-items:center;font-weight:600;padding-top:22px}
.chk input{width:18px;height:18px}
#toasts{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:90vw;pointer-events:auto}
.toast.ok{background:var(--ok);color:#fff}.toast.bad{background:var(--bad);color:#fff}
.banner{background:var(--warnbg);color:var(--warn);padding:10px 14px;border-radius:9px;margin-bottom:16px;font-size:14px}

/* ujian */
.q{padding:16px 18px}
.q .qt{font-weight:600;margin-bottom:10px;white-space:pre-wrap}
.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border:1px solid var(--line);border-radius:9px;margin-top:6px;cursor:pointer}
.opt:hover{border-color:var(--brand)}
.opt input{width:auto;margin-top:4px}
.opt.right{background:var(--okbg);border-color:var(--ok)}.opt.wrong{background:var(--badbg);border-color:var(--bad)}
.examhd{position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);z-index:15;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;margin-bottom:14px;flex-wrap:wrap}
.timer{font:700 24px/1 "Bricolage Grotesque",sans-serif;color:var(--acc);font-variant-numeric:tabular-nums}
.bigscore{font:700 56px/1 "Bricolage Grotesque",sans-serif}
.optrow{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;margin-top:6px}
.optrow input[type=radio]{width:auto}

@media (max-width:980px){
  .app{grid-template-columns:1fr}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);height:auto;flex-direction:row;align-items:center;padding:8px 10px;z-index:30;gap:10px}
  .brand{padding:0}.brand small,.who{display:none}
  .nav{flex-direction:row;overflow-x:auto;gap:4px;flex:1}
  .nav button{padding:8px 11px;white-space:nowrap}
  .nav button[aria-current="page"]::before,.nav button[aria-current="page"]::after{display:none}
  .nav button[aria-current="page"]{box-shadow:inset 0 -3px 0 var(--acc)}
  .nav button span{display:none}.nav button[aria-current="page"] span{display:inline}
  .top{top:calc(env(safe-area-inset-top,0px) + 56px)}
  .examhd{top:calc(env(safe-area-inset-top,0px) + 112px)}
  .main{padding:0 14px 60px}
  .hero{grid-template-columns:1fr}
  h1{font-size:24px}
  .mbody{grid-template-columns:1fr}
  .lamp .adds{grid-template-columns:1fr 1fr}
  .lamp .adds>*:first-child{grid-column:1/-1}
}
@media (prefers-reduced-motion:no-preference){.toast{animation:tin .2s ease-out}@keyframes tin{from{opacity:0;transform:translateY(8px)}}}

.grid thead th{height:28px;position:sticky;z-index:3}
.grid thead tr:nth-child(1) th{top:0}.grid thead tr:nth-child(2) th{top:28px}.grid thead tr:nth-child(3) th{top:56px}
.grid thead tr:nth-child(4) th{top:84px}.grid thead tr:nth-child(5) th{top:112px}.grid thead tr:nth-child(6) th{top:140px}.grid thead tr:nth-child(7) th{top:168px}
.grid thead th.stk,.grid thead th.stk2{z-index:5}
select.stsel{width:100%;min-width:150px;font-weight:600;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
select.stsel[class*="mk-"]{border-color:transparent}
code{background:var(--s2);padding:1px 6px;border-radius:5px;font-size:13px}
</style>
</head>
<body>
<div class="app">
  <aside class="rail" aria-label="Menu utama">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="9" fill="#14354A"/><path d="M9 12h6v4h-3v6h10v-6h-3v-4h6v14H9z" fill="none" stroke="#E8590C" stroke-width="2" stroke-linejoin="round"/><circle cx="17" cy="9" r="2.2" fill="#35BFD3"/></svg>
      <div><b>Jurnal Guru</b><small>TJKT · <span id="taLbl">2026/2027</span></small></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="who"><b id="whoName">Pandu Rachmawan, S.Kom</b>Kode guru 26 · SMKS Bhakti Insani Bogor</div>
  </aside>
  <div class="main">
    <div class="top" id="top"></div>
    <div id="storeWarn"></div>
    <main id="main"></main>
  </div>
</div>
<div class="mwrap" id="modal" hidden></div>
<div class="mwrap" id="confirm" hidden></div>
<div id="toasts" role="status" aria-live="polite"></div>
<script src="firebase-config.js"></script>
<script src="fbapi.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
'use strict';
/* ================= util ================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>(p||'id')+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const pad=n=>String(n).padStart(2,'0');
const HARI=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const BULAN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());

  del(k){if(!this.db){this.mem.delete(k);return Promise.resolve()}return new Promise(res=>{const t=this.db.transaction('f','readwrite');t.objectStore('f').delete(k);t.oncomplete=()=>res();t.onerror=()=>res()})}

function jadwalOn(t,kid){
  const dow=pd(t).getDay();
  if(dow<1||dow>5||t<S.setting.jadwalMulai||isLibur(t))return[];
  return S.jadwal.filter(j=>j.hari===dow&&(!kid||j.kelas===kid)).sort((a,b)=>a.a-b.a);

function datesIn(from,to){const out=[];if(!from||!to)return out;const d=pd(from),e=pd(to);while(d<=e){out.push(ymd(d));d.setDate(d.getDate()+1)}return out}
const findSesi=(k,t,j)=>S.sesi.find(s=>s.kelas===k&&s.tgl===t&&s.jam===j);
const findJurnal=(k,t,j)=>S.jurnal.find(s=>s.kelas===k&&s.tgl===t&&s.jam===j);

function cntSesi(s){
  const ids=new Set(siswaOf(s.kelas).map(x=>x.id));const c={H:0,S:0,I:0,A:0,D:0,n:0};
  for(const [sid,v] of Object.entries(s.hadir||{})){if(ids.has(sid)&&v){c[v]++;c.n++}}return c;
}
function planSesi(kid,from,to){
  const out=[];
  for(const t of datesIn(from,to)){
    if(t<S.setting.jadwalMulai)continue;
    for(const b of jadwalOn(t,kid)){const j=jamLabel(b);if(!findSesi(kid,t,j))out.push({tgl:t,jam:j})}
  }return out;
}
function pending(days){
  const out=[],now=new Date(),nm=now.getHours()*60+now.getMinutes();
  for(let i=0;i<=days;i++){
    const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()-i),t=ymd(d);
    for(const b of jadwalOn(t)){
      if(i===0&&nm<endMin(b.hari,b.b))continue;
      const j=jamLabel(b),hasJ=!!findJurnal(b.kelas,t,j),ss=findSesi(b.kelas,t,j),hasA=!!(ss&&Object.values(ss.hadir).some(Boolean));
      if(!hasJ||!hasA)out.push({tgl:t,b,hasJ,hasA});
    }
  }return out;
}

function nilItems(kid,sem,kat){
  let a=S.penilaian.filter(p=>p.kelas===kid&&p.semester===sem&&p.kategori===kat).map(p=>({...p,src:'nil'}));
  if(kat==='tugas')a=a.concat(S.tugas.filter(t=>t.kelas===kid&&t.semester===sem).map(t=>({id:t.id,judul:t.judul,tgl:t.tgl,kategori:'tugas',src:'tugas'})));
  return a.sort((x,y)=>(x.tgl||'').localeCompare(y.tgl||''));
}
const scoreOf=(iid,sid)=>{const v=S.scores[iid]&&S.scores[iid][sid];return typeof v==='number'?v:null};
function avgKat(kid,sem,kat,sid){const vs=nilItems(kid,sem,kat).map(i=>scoreOf(i.id,sid)).filter(v=>v!=null);return vs.length?vs.reduce((a,b)=>a+b,0)/vs.length:null}
function nilaiAkhir(kid,sem,sid){
  const w=S.setting.bobot;let sum=0,tw=0;const r={};
  for(const k of ['tugas','ulangan','praktik']){const a=avgKat(kid,sem,k,sid);r[k]=a;if(a!=null){sum+=a*w[k];tw+=w[k]}}
  r.na=tw?sum/tw:null;return r;
}
function recapHadir(kid,sessions,sid){
  const c={H:0,S:0,I:0,A:0,D:0,n:0};
  for(const s of sessions){const v=s.hadir[sid];if(v){c[v]++;c.n++}}
  c.pct=c.n?(c.H+c.D)/c.n*100:null;return c;
}

function ask(msg,onYes,yes,detail){
  CONFIRM=onYes;const c=$('#confirm');
  c.innerHTML=`<div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="ct" style="width:min(440px,100%)"><header><h2 id="ct">${esc(msg)}</h2></header>${detail?`<div style="padding:16px 20px">${detail}</div>`:''}<footer><button class="btn ghost" data-act="c-no">Batal</button><button class="btn ${yes==='Simpan'||yes==='Mulai'||yes==='Lanjut'?'primary':'danger'}" data-act="c-yes">${yes||'Hapus'}</button></footer></div>`;
  c.hidden=false;c.querySelector('[data-act="c-yes"]').focus();
}
function closeConfirm(){CONFIRM=null;$('#confirm').hidden=true;$('#confirm').innerHTML=''}

async function saveFile(name,data){
  let dl=null;try{if(window.claude&&window.claude.use)dl=await window.claude.use('downloads')}catch(e){}
  if(dl){
    try{await dl.save({filename:name,data});toast('Berkas siap: '+name,'ok')}
    catch(e){if(e&&e.code==='declined')return;toast(e&&e.code==='rejected_extension'?'Format berkas ini tidak bisa diunduh langsung dari sini.':'Gagal mengunduh ('+((e&&e.code)||'error')+').','bad')}
    return;
  }
  try{const b=data instanceof Blob?data:new Blob([data]);const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}catch(e){toast('Unduhan tidak tersedia di tampilan ini.','bad')}
}
function xlsxOK(){if(typeof XLSX==='undefined'){toast('Pustaka Excel belum termuat. Periksa koneksi internet lalu muat ulang halaman.','bad');return false}return true}
function xlsxSave(wb,name){const buf=XLSX.write(wb,{bookType:'xlsx',type:'array'});saveFile(name,new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}))}

function jadwalChips(t){
  const bl=t?jadwalOn(t):[];
  if(!bl.length)return '<span class="mut">Tidak ada jadwal pada tanggal ini. Jam bisa diisi manual.</span>';
  return '<span class="mut">Jadwal pada tanggal ini (klik untuk mengisi):</span><div class="chips">'+bl.map(b=>`<button type="button" class="chip" data-act="fill-jadwal" data-kelas="${b.kelas}" data-jam="${jamLabel(b)}">${esc(kNama(b.kelas))} · jam ${jamLabel(b)} · ${waktuBlok(b.hari,b.a,b.b)}</button>`).join('')+'</div>';
}
function sesiInfo(v){
  if(!v.tgl)return '';
  const d=pd(v.tgl),jam=normJam(v.jam),p=parseJam(jam);
  const w=p?waktuBlok(d.getDay(),p[0],p[1]):'';
  let h=`<div><b>${HARI[d.getDay()]}</b>, minggu ke-${wom(v.tgl)} ${BULAN[d.getMonth()]} ${d.getFullYear()}${w?` · waktu ${w}`:''}</div>`;
  const ss=v.kelas&&jam?findSesi(v.kelas,v.tgl,jam):null;
  if(ss){const c=cntSesi(ss);if(c.n)h+=`<div class="chips"><span class="chip ok">Hadir ${c.H}</span><span class="chip info">Sakit ${c.S}</span><span class="chip warn">Ijin ${c.I}</span><span class="chip bad">Tidak hadir ${c.A}</span></div>`}
  return h+jadwalChips(v.tgl);
}

function openEnt(coll,id,preset){
  const E=ENT[coll];const cur=id?JSON.parse(JSON.stringify(byId(S[coll],id))):Object.assign({},E.def?E.def():{},preset||{});
  const fields=E.fields(cur);
  openModal({title:(id?'Ubah ':'Tambah ')+E.title,fields,vals:cur,wide:E.wide,media:E.media,lamp:cur.lampiran,del:id?()=>delEnt(coll,id,true):null,
    onSave:v=>{
      if(E.validate){const e=E.validate(v,id);if(e){toast(e,'bad');return false}}
      if(E.beforeSave)E.beforeSave(v);
      if(id){Object.assign(byId(S[coll],id),v)}else{v.id=uid(coll);if(coll==='kuis')v.soal=[];S[coll].push(v)}
      if(E.afterSave)E.afterSave(v);
      save();render();toast('Tersimpan','ok');
    }});
}
function lampFiles(o){return((o&&o.lampiran)||[]).filter(x=>x.k==='f').map(x=>x.fid)}
function delEnt(coll,id,fromModal){
  const it=byId(S[coll],id);if(!it)return;
  let msg='Hapus data ini?',det='';
  if(coll==='siswa'){msg='Hapus siswa "'+it.nama+'"?';det='Data absensi, nilai, dan pengumpulan tugas siswa ini ikut terhapus.'}
  if(coll==='sesi'){msg='Hapus pertemuan ini?';det='Data kehadiran pada pertemuan ini ikut terhapus.'}
  if(coll==='tugas'){msg='Hapus tugas "'+it.judul+'"?';det='Data pengumpulan dan nilai tugas ini ikut terhapus.'}
  if(coll==='kuis'){msg='Hapus ujian "'+it.judul+'"?';det='Soal dan semua hasil ujian ini ikut terhapus.'}
  if(coll==='penilaian'){msg='Hapus komponen "'+it.judul+'"?';det='Semua nilai pada komponen ini ikut terhapus.'}
  ask(msg,()=>{
    if(fromModal)closeModal(false);
    lampFiles(it).forEach(f=>FileDB.del(f));
    S[coll]=S[coll].filter(x=>x.id!==id);
    if(coll==='siswa'){S.sesi.forEach(s=>delete s.hadir[id]);Object.values(S.scores).forEach(m=>delete m[id]);Object.values(S.sub).forEach(m=>{if(m[id]){lampFiles(m[id]).forEach(f=>FileDB.del(f));delete m[id]}});S.hasil=S.hasil.filter(h=>h.siswaId!==id);S.catatan=S.catatan.filter(c=>c.siswaId!==id)}
    if(coll==='tugas'){delete S.scores[id];if(S.sub[id]){Object.values(S.sub[id]).forEach(m=>lampFiles(m).forEach(f=>FileDB.del(f)));delete S.sub[id]}if(UI.tugasOpen===id)UI.tugasOpen=null}
    if(coll==='penilaian'){delete S.scores[id]}
    if(coll==='kuis'){S.hasil=S.hasil.filter(h=>h.kuisId!==id);S.penilaian=S.penilaian.filter(p=>{if(p.kuisId===id){delete S.scores[p.id];return false}return true});if(UI.kuisEdit===id)UI.kuisEdit=null;if(UI.kuisHasil===id)UI.kuisHasil=null}
    save();render();toast('Terhapus');
  },'Hapus',det);
}

function blockState(t,b,now){
  if(t!==ymd(now))return 'future';
  const nm=now.getHours()*60+now.getMinutes();const tt=jamTable(b.hari);
  const [sh,sm]=tt[b.a][0].split('.').map(Number);
  if(nm>=endMin(b.hari,b.b))return 'past';if(nm>=sh*60+sm)return 'now';return 'future';
}
function sesiCard(t,b,state){
  const j=jamLabel(b),hasJ=findJurnal(b.kelas,t,j),ss=findSesi(b.kelas,t,j),hasA=ss&&Object.values(ss.hadir).some(Boolean);
  return `<article class="card sesi ${clsIdx(b.kelas)} ${state||''}"><div class="jam">${j}<small>jam ke</small></div>
    <div><strong>${esc(kNama(b.kelas))}</strong> · ${esc(MAPEL[b.mapel]||b.mapel)} ${state==='now'?'<span class="chip warn">Sedang berlangsung</span>':''}<div class="mut sm">${waktuBlok(b.hari,b.a,b.b)}${b.ruang?' · '+esc(b.ruang):''}</div></div>
    <div class="btns"><button class="btn sm ${hasJ?'':'primary'}" data-act="j-from" data-k="${b.kelas}" data-t="${t}" data-j="${j}">${ic('book')} ${hasJ?'Ubah jurnal':'Isi jurnal'}</button>
    <button class="btn sm" data-act="abs-go" data-k="${b.kelas}" data-t="${t}" data-j="${j}">${ic('check')} ${hasA?'Lihat absensi':'Isi absensi'}</button></div></article>`;
}
function vPanel(){
  const dow=new Date().getDay();
  return [1,2,3,4,5].map(h=>{
    const bl=S.jadwal.filter(j=>j.hari===h),max=h===5?6:11,ports=[];
    for(let p=1;p<=11;p++){
      if(p>max){ports.push('<span class="port off"></span>');continue}
      const j=bl.find(x=>p>=x.a&&p<=x.b);
      if(j){const pos=(p===j.a?'first ':'')+(p===j.b?'last ':'')+(p!==j.a&&p!==j.b?'mid':'');ports.push(`<span class="port on ${clsIdx(j.kelas)} ${pos}" title="${esc(kNama(j.kelas))} jam ${jamLabel(j)}">${p===j.a?kShort(j.kelas):''}</span>`)}
      else ports.push(`<span class="port">${p}</span>`);
    }
    return `<div class="prow ${h===dow?'today':''}"><b>${HARI[h]}</b><div class="ports">${ports.join('')}</div></div>`;
  }).join('');
}

  const now=new Date(),t=ymd(now),{k,s}=GK(),kk=K();

  let right='';
  if(bl.length)right=bl.map(b=>sesiCard(t,b,blockState(t,b,now))).join('');
  else{
    let nx='';
    for(let i=1;i<=14&&!nx;i++){const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()+i),tt=ymd(d),l=jadwalOn(tt);if(l.length)nx=`<p class="mut" style="margin:6px 0 10px">Jadwal berikutnya: <b>${fTglP(tt)}</b></p>`+l.map(b=>sesiCard(tt,b,'future')).join('')}

  const rcHead=['H','S','I','A','D','%'].map(c=>`<th class="rc" rowspan="7" style="vertical-align:middle">${c}</th>`).join('')+'<th rowspan="7" style="vertical-align:middle;min-width:110px">Ket</th>';
  const body=sis.map((w,i)=>{

  }).join('');
  const foot=`<tr><td class="stk nm" colspan="2" style="text-align:left;z-index:3">Jumlah hadir</td>${sess.map(x=>{const c=cntSesi(x);return `<td>${c.n?c.H+c.D:'–'}</td>`}).join('')}<td colspan="7"></td></tr>`;
  // pindahkan header kolom rekap ke baris pertama
  const headFixed=head.replace('</tr>',rcHead+'</tr>');

}

/* ================= NILAI ================= */
const KAT={tugas:'Nilai tugas',ulangan:'Nilai ulangan',praktik:'Nilai praktik'};
function vNilai(){
  const {k,s}=GK(),sis=siswaOf(k),tab=UI.nilaiTab,kt=S.setting.kktp,w=S.setting.bobot;
  const tabs=`<div class="tabs" role="tablist">${[...Object.entries(KAT),['akhir','Nilai akhir']].map(([v,l])=>`<button role="tab" aria-selected="${tab===v}" data-act="nil-tab" data-v="${v}">${l}</button>`).join('')}</div>`;
  const head=pgHead('Nilai',`${esc(K().nama)} · semester ${s} · KKTP ${kt} · bobot tugas ${w.tugas}%, ulangan ${w.ulangan}%, praktik ${w.praktik}% (ubah di Pengaturan)`,
    `<button class="btn" data-act="x-nilai">${ic('dl')} Excel</button>${tab==='akhir'?'':`<label class="btn" for="imp-nilai">${ic('upload')} Impor nilai dari Excel</label><input type="file" id="imp-nilai" accept=".xlsx,.csv" style="position:absolute;width:1px;height:1px;opacity:0">`+addBtn('penilaian','Tambah komponen')}`);
  if(!sis.length)return head+tabs+emptyBox('Belum ada siswa di kelas ini');
  if(tab==='akhir'){
    const rows=sis.map((x,i)=>{const r=nilaiAkhir(k,s,x.id);const st=r.na==null?'':r.na>=kt?'ok':'bad';
      return `<tr><td>${i+1}</td><td class="nowrap">${esc(x.nama)}</td><td class="num">${fn(r.tugas)}</td><td class="num">${fn(r.ulangan)}</td><td class="num">${fn(r.praktik)}</td><td class="num"><b>${fn(r.na)}</b></td><td>${r.na==null?'–':`<span class="chip ${st}">${r.na>=kt?'Tuntas':'Remedial'}</span>`}</td></tr>`}).join('');
    return head+tabs+`<div class="card tw"><table class="tbl"><thead><tr><th>No</th><th>Nama</th><th class="num">Tugas</th><th class="num">Ulangan</th><th class="num">Praktik</th><th class="num">Nilai akhir</th><th>Ketuntasan</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }
  const items=nilItems(k,s,tab);
  if(!items.length)return head+tabs+emptyBox('Belum ada komponen '+KAT[tab].toLowerCase(),'Tambah komponen, atau impor dari Excel/CSV (kolom NAMA + kolom nilai). '+(tab==='tugas'?'Komponen muncul otomatis dari menu Tugas, atau tambah manual.':'Contoh komponen: Ulangan Harian 1 atau Praktik Crimping.'),addBtn('penilaian','Tambah komponen'));
  const th=items.map(it=>`<th style="min-width:96px;padding:6px"><div style="font-weight:700">${esc(it.judul)}</div><div class="mut" style="font-weight:400">${it.tgl?fTgl(it.tgl):''}</div>${it.src==='nil'?`<div><button class="icon-btn" style="padding:2px" data-act="ent-edit" data-coll="penilaian" data-id="${it.id}" title="Ubah atau hapus" aria-label="Ubah komponen">${ic('pen')}</button>${it.kuisId?'<span class="chip info">Kuis</span>':''}</div>`:`<div><button class="chip" data-act="tugas-open" data-id="${it.id}">Tugas</button></div>`}</th>`).join('');
  const body=sis.map((x,i)=>`<tr data-row="${x.id}"><td class="stk no">${i+1}</td><td class="stk2 nm" title="${esc(x.nama)}">${esc(x.nama)}</td>${items.map(it=>{const v=scoreOf(it.id,x.id);return `<td><input class="sc ${v!=null&&v<kt?'low':''}" type="number" min="0" max="100" step="any" inputmode="decimal" value="${v==null?'':v}" data-chg="score" data-i="${it.id}" data-p="${x.id}" aria-label="${esc(x.nama)} — ${esc(it.judul)}"></td>`}).join('')}<td class="rc" id="avg-${x.id}"><b>${fn(avgKat(k,s,tab,x.id))}</b></td></tr>`).join('');
  return head+tabs+`<div class="card tw" style="max-height:72vh;overflow:auto"><table class="grid"><thead><tr><th class="stk no">No</th><th class="stk2 nm">Nama siswa</th>${th}<th class="rc" style="min-width:64px">Rata-rata</th></tr></thead><tbody>${body}</tbody></table></div>
  <p class="mut sm" style="margin-top:10px">Impor nilai: Excel/CSV dengan kolom NAMA dan satu atau lebih kolom nilai (judul kolom jadi nama komponen; hasil Google Form juga bisa). Ketik nilai 0–100 lalu tekan Tab untuk pindah. Perubahan tersimpan otomatis; nilai di bawah KKTP berwarna merah.</p>`;
}

/* ================= UJIAN ONLINE ================= */
const KT={pg:'Pilihan ganda',bs:'Benar / Salah',isian:'Isian singkat'};
const LET=['A','B','C','D','E'];
const normTxt=s=>String(s==null?'':s).trim().toLowerCase().replace(/\s+/g,' ');
function grade(q,ans){
  let ok=0;const det={};
  q.soal.forEach(s=>{const a=ans[s.id];let c=false;
    if(s.t==='isian')c=a!=null&&String(s.key||'').split('|').map(normTxt).includes(normTxt(a));else c=a!=null&&a===s.key;
    det[s.id]=c;if(c)ok++});
  return {ok,total:q.soal.length,skor:q.soal.length?Math.round(ok/q.soal.length*1000)/10:0,det};
}
function vUjian(){
  if(UI.run)return vRun();
  if(UI.kuisEdit&&byId(S.kuis,UI.kuisEdit))return vSoal(byId(S.kuis,UI.kuisEdit));
  if(UI.kuisHasil&&byId(S.kuis,UI.kuisHasil))return vHasil(byId(S.kuis,UI.kuisHasil));
  const {k,s}=GK();const l=S.kuis.filter(q=>q.kelas===k&&q.semester===s);
  return pgHead('Ujian online',`${esc(K().nama)} · semester ${s}. Siswa mengerjakan di perangkat ini (mode ujian dengan timer), nilai dikoreksi otomatis.`,addBtn('kuis','Buat ujian'))+
  `<div class="list">${l.map(q=>{const h=S.hasil.filter(x=>x.kuisId===q.id);const sis=new Set(siswaOf(k).map(x=>x.id));const ikut=new Set(h.filter(x=>sis.has(x.siswaId)).map(x=>x.siswaId)).size;
    return `<article class="card item"><header><div><h3>${esc(q.judul)}</h3><div class="chips"><span class="chip">${esc(q.jenis)}</span><span class="chip">${q.soal.length} soal</span><span class="chip">${q.durasi} menit</span><span class="chip">Tuntas ≥ ${q.kktp}</span>${q.elemen?`<span class="chip info">${esc(q.elemen)}</span>`:''}<span class="chip ${ikut?'ok':''}">${ikut}/${sis.size} sudah ikut</span></div></div>${rowActs('kuis',q.id)}</header>
    ${q.petunjuk?`<div class="body">${esc(q.petunjuk)}</div>`:''}<div class="foot"><button class="btn sm acc" data-act="kuis-start" data-id="${q.id}" ${q.soal.length?'':'disabled'}>Mulai ujian</button><button class="btn sm" data-act="kuis-soal" data-id="${q.id}">Kelola soal</button><button class="btn sm" data-act="kuis-hasil" data-id="${q.id}">Hasil</button><button class="btn sm" data-act="kuis-nilai" data-id="${q.id}">Salin ke nilai ulangan</button><button class="btn sm" data-act="share" data-coll="kuis" data-id="${q.id}">${ic('upload')} Bagikan ke siswa</button>${lampChips(q.lampiran)}</div></article>`}).join('')||emptyBox('Belum ada ujian','Buat kuis, tambahkan soal (atau impor dari Excel), lalu jalankan di kelas.',addBtn('kuis','Buat ujian'))}</div>`;
}
function soalCard(q,s,i){
  const keyIn=s.t==='pg'?LET.map((L,x)=>`<div class="optrow"><input type="radio" name="key-${s.id}" value="${L}" ${s.key===L?'checked':''} data-chg="soalkey" data-q="${s.id}" aria-label="Kunci ${L}"><input type="text" value="${esc(s.opts[x]||'')}" placeholder="Pilihan ${L}${x>=4?' (opsional)':''}" data-chg="soalopt" data-q="${s.id}" data-x="${x}" aria-label="Pilihan ${L}"><b>${L}</b></div>`).join('')+'<p class="mut sm" style="margin-top:6px">Pilih tombol bulat di sebelah kiri pilihan yang benar.</p>'
   :s.t==='bs'?`<div class="row" style="margin-top:6px">${['Benar','Salah'].map(v=>`<label class="opt"><input type="radio" name="key-${s.id}" value="${v}" ${s.key===v?'checked':''} data-chg="soalkey" data-q="${s.id}"> Kunci: ${v}</label>`).join('')}</div>`
   :`<label class="fld" style="margin-top:6px"><span>Jawaban benar (beberapa alternatif dipisah tanda |)</span><input type="text" value="${esc(s.key||'')}" data-chg="soalkey" data-q="${s.id}" placeholder="mis. 192.168.1.1|192.168.1.1/24"></label>`;
  return `<article class="card q" id="soal-${s.id}"><div class="row" style="justify-content:space-between;margin-bottom:8px"><b>Soal ${i+1}</b><div class="row"><select data-chg="soaltype" data-q="${s.id}" style="width:auto" aria-label="Jenis soal">${Object.entries(KT).map(([v,l])=>`<option value="${v}" ${s.t===v?'selected':''}>${l}</option>`).join('')}</select>
  <button class="icon-btn" data-act="soal-up" data-q="${s.id}" title="Naikkan" aria-label="Naikkan">↑</button><button class="icon-btn" data-act="soal-down" data-q="${s.id}" title="Turunkan" aria-label="Turunkan">↓</button><button class="icon-btn" data-act="soal-del" data-q="${s.id}" title="Hapus soal" aria-label="Hapus soal">${ic('trash')}</button></div></div>
  <textarea rows="2" data-chg="soalq" data-q="${s.id}" placeholder="Tulis pertanyaan…" aria-label="Pertanyaan">${esc(s.q)}</textarea>${keyIn}</article>`;
}
function vSoal(q){
  return pgHead('Kelola soal · '+esc(q.judul),`${q.soal.length} soal · durasi ${q.durasi} menit. Perubahan tersimpan otomatis.`,
    `<button class="btn" data-act="kuis-tpl">${ic('dl')} Templat Excel</button><label class="btn" for="imp-soal">${ic('upload')} Impor soal dari Excel</label><input type="file" id="imp-soal" accept=".xlsx,.csv" style="position:absolute;width:1px;height:1px;opacity:0"><button class="btn primary" data-act="kuis-done">Simpan & kembali</button><button class="btn ghost" data-act="kuis-cancel">Batal</button>`)+
  `<div class="list">${q.soal.map((s,i)=>soalCard(q,s,i)).join('')||emptyBox('Belum ada soal','Tambah soal satu per satu atau impor dari Excel (kolom: Soal, A, B, C, D, E, Kunci).')}</div>
  <div class="row" style="margin-top:14px"><button class="btn primary" data-act="soal-add" data-q="${q.id}">${ic('plus')} Tambah soal</button></div>`;
}
function vHasil(q){
  const sis=siswaOf(q.kelas);const hs=S.hasil.filter(h=>h.kuisId===q.id).sort((a,b)=>b.waktu-a.waktu);
  const best={};hs.forEach(h=>{if(!best[h.siswaId]||h.skor>best[h.siswaId])best[h.siswaId]=h.skor});
  const vals=Object.values(best);
  return pgHead('Hasil · '+esc(q.judul),`${esc(kNama(q.kelas))} · ${q.soal.length} soal`,`<button class="btn" data-act="x-kuis" data-id="${q.id}">${ic('dl')} Excel</button><button class="btn" data-act="kuis-nilai" data-id="${q.id}">Salin ke nilai ulangan</button><button class="btn" data-act="kuis-back">Kembali</button>`)+
  `<div class="facts" style="margin-top:0"><div class="card fact"><b>${vals.length}/${sis.length}</b><span>siswa sudah ikut</span></div><div class="card fact"><b>${fn(vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:null)}</b><span>rata-rata nilai tertinggi</span></div><div class="card fact"><b>${vals.filter(v=>v>=q.kktp).length}</b><span>tuntas (≥ ${q.kktp})</span></div></div>
  <div class="card tw"><table class="tbl"><thead><tr><th>No</th><th>Nama</th><th class="num">Nilai tertinggi</th><th>Percobaan</th><th>Status</th></tr></thead><tbody>${sis.map((x,i)=>{const mine=hs.filter(h=>h.siswaId===x.id);const b=best[x.id];
    return `<tr><td>${i+1}</td><td>${esc(x.nama)}</td><td class="num"><b>${fn(b)}</b></td><td>${mine.map(h=>`<span class="chip">${fn(h.skor)} <span class="mut">${h.ok}/${h.total} · ${fTgl(ymd(new Date(h.waktu)))}</span><button class="icon-btn" style="padding:0" data-act="hasil-del" data-id="${h.id}" aria-label="Hapus percobaan">${ic('x')}</button></span>`).join(' ')||'<span class="mut">Belum ikut</span>'}</td><td>${b==null?'–':`<span class="chip ${b>=q.kktp?'ok':'bad'}">${b>=q.kktp?'Tuntas':'Remedial'}</span>`}</td></tr>`}).join('')}</tbody></table></div>`;
}

function vRun(){

let runTimer=null;
function startTimer(){
  clearInterval(runTimer);
  const tick=()=>{const r=UI.run;if(!r||r.done){clearInterval(runTimer);return}
    const left=Math.max(0,Math.round((r.end-Date.now())/1000));const el=$('#timer');if(el){el.textContent=pad(Math.floor(left/60))+':'+pad(left%60);el.style.color=left<60?'var(--bad)':''}
    if(left<=0){clearInterval(runTimer);submitRun(true)}};
  tick();runTimer=setInterval(tick,1000);
}
function submitRun(auto){
  const r=UI.run;if(!r||r.done)return;const q=byId(S.kuis,r.kuisId);
  const g=grade(q,r.ans);
  const h={id:uid('hs'),kuisId:q.id,siswaId:r.siswaId,waktu:Date.now(),skor:g.skor,ok:g.ok,total:g.total};
  S.hasil.push(h);save();r.done={...h,det:g.det};clearInterval(runTimer);

function aoaAbsen(k,s){
  const kk=byId(S.kelas,k),sis=siswaOf(k),sess=S.sesi.filter(x=>x.kelas===k&&semOf(x.tgl)===s).sort(cmpSesi);
  const A=[['DAFTAR KEHADIRAN SISWA'],[S.profil.sekolah.toUpperCase()],['TAHUN PELAJARAN '+S.profil.ta+' · SEMESTER '+s.toUpperCase()],[],['Kelas',': '+kk.nama,'','Wali Kelas : '+kk.wali],['Guru',': '+S.profil.guru],[]];
  const L=(lab,f)=>[lab,''].concat(sess.map(f));
  A.push(L('Jam ke',x=>x.jam),L('Tgl',x=>pd(x.tgl).getDate()),L('Hari',x=>HARI[pd(x.tgl).getDay()]),L('Minggu ke-',x=>wom(x.tgl)),L('Bulan',x=>BULAN[pd(x.tgl).getMonth()]),L('Tahun',x=>pd(x.tgl).getFullYear()));
  A.push(['NO','NAMA'].concat(sess.map(()=>'')).concat(['H','S','I','A','D','%','KET']));
  sis.forEach((w,i)=>{const r=recapHadir(k,sess,w.id);A.push([i+1,w.nama].concat(sess.map(x=>x.hadir[w.id]||'')).concat([r.H,r.S,r.I,r.A,r.D,r.pct==null?'':Math.round(r.pct),w.ket||'']))});
  return A;
}
function aoaNilai(k,s,kat){
  const sis=siswaOf(k),it=nilItems(k,s,kat);
  const A=[['NILAI '+KAT[kat].toUpperCase().replace('NILAI ','')+' · '+kNama(k)+' · SEMESTER '+s],[],['NO','NAMA'].concat(it.map(i=>i.judul)).concat(['RATA-RATA'])];
  sis.forEach((w,i)=>A.push([i+1,w.nama].concat(it.map(x=>{const v=scoreOf(x.id,w.id);return v==null?'':v})).concat([avgKat(k,s,kat,w.id)==null?'':Math.round(avgKat(k,s,kat,w.id)*10)/10])));
  return A;
}
function aoaAkhir(k,s){
  const A=[['NILAI AKHIR · '+kNama(k)+' · SEMESTER '+s],['KKTP '+S.setting.kktp+' · bobot T/U/P '+S.setting.bobot.tugas+'/'+S.setting.bobot.ulangan+'/'+S.setting.bobot.praktik],[],['NO','NAMA','TUGAS','ULANGAN','PRAKTIK','NILAI AKHIR','KETUNTASAN']];
  siswaOf(k).forEach((w,i)=>{const r=nilaiAkhir(k,s,w.id),q=v=>v==null?'':Math.round(v*10)/10;A.push([i+1,w.nama,q(r.tugas),q(r.ulangan),q(r.praktik),q(r.na),r.na==null?'':r.na>=S.setting.kktp?'Tuntas':'Remedial'])});
  return A;
}
function aoaJurnal(list){
  const A=[['JURNAL MENGAJAR · '+S.profil.guru+' · TAHUN PELAJARAN '+S.profil.ta],[],['NO','HARI','TANGGAL','MINGGU KE-','BULAN','TAHUN','JAM KE','WAKTU','KELAS','ELEMEN','TUJUAN PEMBELAJARAN','MATERI / KEGIATAN','METODE','HADIR','SAKIT','IZIN','ALFA','STATUS','KENDALA','TINDAK LANJUT','REFLEKSI']];
  [...list].sort((a,b)=>a.tgl.localeCompare(b.tgl)).forEach((j,i)=>{const d=pd(j.tgl),p=parseJam(j.jam),ss=findSesi(j.kelas,j.tgl,j.jam),c=ss?cntSesi(ss):{H:'',S:'',I:'',A:''};
    A.push([i+1,HARI[d.getDay()],j.tgl,wom(j.tgl),BULAN[d.getMonth()],d.getFullYear(),j.jam,p?waktuBlok(d.getDay(),p[0],p[1]):'',kNama(j.kelas),j.elemen||'',j.tp||'',j.materi||'',j.metode||'',c.H,c.S,c.I,c.A,j.status,j.kendala||'',j.tindak||'',j.refleksi||''])});
  return A;
}

const nrm=s=>String(s==null?'':s).toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
function matchSiswa(kid,name){
  const list=siswaOf(kid),n=nrm(name);if(!n)return null;
  let m=list.find(x=>nrm(x.nama)===n);if(m)return m;
  const nt=n.split(' ').sort().join(' ');m=list.find(x=>nrm(x.nama).split(' ').sort().join(' ')===nt);if(m)return m;
  const c=list.filter(x=>{const a=nrm(x.nama);return a.startsWith(n)||n.startsWith(a)||(n.length>=6&&a.includes(n))});
  return c.length===1?c[0]:null;
}
const STMAP=s=>{const t=nrm(s);if(/^(h|hadir|present)$/.test(t))return 'H';if(/^(s|sakit)$/.test(t))return 'S';if(/^(i|ijin|izin|permit)$/.test(t))return 'I';if(/^(a|alfa|alpa|tidak hadir|absen)$/.test(t))return 'A';if(/^(d|dispensasi|dispen)$/.test(t))return 'D';return ''};
async function importAbsen(file,ss){
  if(!xlsxOK()||!ss)return;
  try{
    const rows=await readSheet(file),hi=rows.findIndex(r=>r.some(c=>/nama/i.test(String(c))));
    if(hi<0){toast('Kolom "Nama" tidak ditemukan di baris judul.','bad');return}
    const h=rows[hi].map(c=>String(c).toLowerCase()),cn=h.findIndex(c=>/nama/.test(c)),cs=h.findIndex(c=>/status|kehadiran|absen/.test(c));
    const hits=new Map(),miss=[];
    rows.slice(hi+1).forEach(r=>{const n=String(r[cn]||'').trim();if(!n)return;const w=matchSiswa(ss.kelas,n);if(!w){miss.push(n);return}hits.set(w.id,cs>=0?(STMAP(r[cs])||'H'):'H')});
    if(!hits.size){toast('Tidak ada nama yang cocok dengan siswa di '+kNama(ss.kelas)+'.','bad');return}
    const c={H:0,S:0,I:0,A:0,D:0};hits.forEach(v=>c[v]++);
    ask('Terapkan kehadiran dari file?',()=>{hits.forEach((v,id)=>{ss.hadir[id]=v});save();render();toast(hits.size+' siswa diperbarui','ok')},'Terapkan',
      hits.size+' siswa cocok (Hadir '+c.H+', Dispensasi '+c.D+', Sakit '+c.S+', Ijin '+c.I+', Tidak hadir '+c.A+'). '+(cs>=0?'':'Tanpa kolom status, semua nama di file dianggap Hadir. ')+'Siswa yang tidak ada di file tidak diubah (bisa ditandai Tidak Hadir dengan tombol di form).'+(miss.length?'<br><br><b>'+miss.length+' nama tidak cocok:</b> '+esc(miss.slice(0,8).join(', '))+(miss.length>8?'…':''):''));
  }catch(e){toast('File tidak bisa dibaca. Gunakan .xlsx atau .csv.','bad')}
}
async function importNilai(file){
  if(!xlsxOK())return;const {k,s}=GK(),kat=UI.nilaiTab;
  try{
    const rows=await readSheet(file),hi=rows.findIndex(r=>r.some(c=>/^nama/i.test(String(c).trim())));
    if(hi<0){toast('Kolom "NAMA" tidak ditemukan di baris judul.','bad');return}
    const head=rows[hi].map(c=>String(c).trim()),cn=head.findIndex(c=>/^nama/i.test(c));
    const skip=/^(no\b|nomor|nis|nisn|nama|l\/p|jk|ket|kelas|timestamp|cap waktu|rata|jumlah|email|alamat email)/i;
    const data=rows.slice(hi+1).filter(r=>String(r[cn]||'').trim());
    const num=v=>parseFloat(String(v).replace(',','.'));
    const cols=head.map((t,i)=>({t,i})).filter(c=>c.t&&c.i!==cn&&!skip.test(c.t)&&data.some(r=>r[c.i]!==''&&!isNaN(num(r[c.i]))));
    if(!cols.length){toast('Tidak ada kolom nilai (angka) yang terbaca.','bad');return}
    const matched=[],miss=[];data.forEach(r=>{const n=String(r[cn]).trim(),w=matchSiswa(k,n);w?matched.push([w,r]):miss.push(n)});
    if(!matched.length){toast('Tidak ada nama yang cocok dengan siswa di '+K().nama+'.','bad');return}
    ask('Impor nilai ke '+KAT[kat].toLowerCase()+'?',()=>{
      cols.forEach(c=>{let it=nilItems(k,s,kat).find(x=>normTxt(x.judul)===normTxt(c.t));
        if(!it){it={id:uid('penilaian'),kelas:k,semester:s,kategori:kat,judul:c.t,tgl:todayStr(),elemen:'',catatan:'Diimpor dari Excel',lampiran:[]};S.penilaian.push(it)}
        S.scores[it.id]=S.scores[it.id]||{};
        matched.forEach(([w,r])=>{const v=num(r[c.i]);if(!isNaN(v))S.scores[it.id][w.id]=Math.min(100,Math.max(0,v))})});
      save();render();toast('Nilai '+matched.length+' siswa diimpor ('+cols.length+' komponen)','ok')},'Impor',
      cols.length+' kolom nilai ('+esc(cols.map(c=>c.t).join(', '))+') untuk '+matched.length+' siswa cocok. Komponen yang namanya sama diperbarui, yang belum ada dibuat baru. Nilai di luar 0–100 dibatasi.'+(miss.length?'<br><br><b>'+miss.length+' nama tidak cocok:</b> '+esc(miss.slice(0,8).join(', '))+(miss.length>8?'…':''):''));
  }catch(e){toast('File tidak bisa dibaca. Gunakan .xlsx atau .csv.','bad')}
}

function kodeBaru(){
  const used=new Set(S.siswa.map(s=>s.kode).filter(Boolean));let k;
  do{k='';const a=new Uint32Array(8);crypto.getRandomValues(a);a.forEach(n=>k+=KODE_ABC[n%KODE_ABC.length])}while(used.has(k));
  return k;
}

/* ----- ambil kiriman siswa ----- */
async function fbPull(){
  if(needLogin())return;
  try{
    setStat('Mengambil data siswa…','busy');
    const byKode=new Map(S.siswa.filter(s=>s.kode).map(s=>[s.kode,s]));
    const [kir,abs,uji]=await Promise.all([FBX.group('kiriman'),FBX.group('absen'),FBX.group('ujian')]);
    let nk=0,na=0,nu=0;
    for(const d of kir){const w=byKode.get(d.path.split('/')[1]);const t=w&&byId(S.tugas,d.data.tugasId||d.id);if(!t)continue;
      const ms=d.data.waktu||Date.now(),tg=ymd(new Date(ms));S.sub[t.id]=S.sub[t.id]||{};
      const isi=String(d.data.isi||'').trim(),isUrl=/^https?:\/\//i.test(isi),cur=S.sub[t.id][w.id]||{};
      S.sub[t.id][w.id]=Object.assign({},cur,{st:t.tenggat&&tg>t.tenggat?'Terlambat':'Dikumpulkan',tgl:tg,cat:isUrl?'Kiriman lewat portal':isi,lampiran:isUrl?[{k:'l',url:isi,title:'Kiriman '+w.nama.split(' ')[0]}]:(cur.lampiran||[]).filter(x=>x.k==='f')});nk++}
    for(const d of abs){const w=byKode.get(d.path.split('/')[1]);const s=w&&byId(S.sesi,d.data.sesiId||d.id);if(!s||!['H','S','I'].includes(d.data.status))continue;
      if(s.hadir[w.id]!==d.data.status){s.hadir[w.id]=d.data.status;na++}}
    for(const d of uji){const w=byKode.get(d.path.split('/')[1]);const q=w&&byId(S.kuis,d.data.kuisId||d.id);if(!q||!d.data.final)continue;
      const key=w.kode+':'+q.id;if(S.hasil.some(h=>h.remote===key))continue;
      const g=grade(q,d.data.jawab||{});S.hasil.push({id:uid('hs'),kuisId:q.id,siswaId:w.id,waktu:d.data.waktu||Date.now(),skor:g.skor,ok:g.ok,total:g.total,remote:key});nu++}
    save();render();toast(`Diambil: ${nk} kiriman tugas, ${na} absen, ${nu} hasil ujian`,'ok');
  }catch(e){setStat('Tersimpan');fbErr(e)}
}

async function fbNilai(){
  if(needLogin())return;
  const s=S.setting.semester,kt=S.setting.kktp,l=S.siswa.filter(w=>w.kode);
  if(!l.length){toast('Buat kode siswa dulu.','bad');return}
  try{
    let n=0;
    for(const w of l){
      const r=nilaiAkhir(w.kelas,s,w.id),items=[];
      for(const kat of Object.keys(KAT))nilItems(w.kelas,s,kat).forEach(it=>{const v=scoreOf(it.id,w.id);if(v!=null)items.push({kat:KAT[kat],judul:it.judul,nilai:v})});
      const kuis=S.kuis.filter(q=>q.kelas===w.kelas).map(q=>{const h=S.hasil.filter(x=>x.kuisId===q.id&&x.siswaId===w.id);return h.length?{judul:q.judul,skor:Math.max(...h.map(x=>x.skor))}:null}).filter(Boolean);
      await FBX.set(`murid/${w.kode}/nilai/ringkas`,{updated:Date.now(),semester:s,kktp:kt,items,kuis,akhir:{tugas:r.tugas,ulangan:r.ulangan,praktik:r.praktik,na:r.na,status:r.na==null?'':r.na>=kt?'Tuntas':'Remedial'}});
      n++;if(n%20===0)setStat('Mengirim nilai '+n+'/'+l.length+'…','busy');
    }
    setStat('Tersimpan');toast('Nilai '+n+' siswa dikirim ke portal','ok');
  }catch(e){fbErr(e)}
}

  }catch(e){fbErr(e)}

}

  if(sub==='koneksi'){
    body=`<div class="card pad"><h2 style="margin-bottom:8px">Status Firebase</h2>
    <p>${FBX?'<span class="chip ok">Terhubung</span>':`<span class="chip bad">Belum terhubung</span>`} ${fbUser&&fbUser.email?`<span class="chip info">Masuk: ${esc(fbUser.email)}</span>`:FBX?'<span class="chip warn">Belum masuk sebagai guru</span>':''}</p>
    ${fbMsg?`<p class="mut" style="margin-top:10px">${esc(fbMsg)}</p>`:''}
    <div class="row" style="margin-top:14px">${FBX&&!isGuruLogin()?`<button class="btn primary" data-act="fb-google">Masuk dengan Google</button><button class="btn" data-act="fb-email">Masuk dengan email &amp; kata sandi</button>`:''}${isGuruLogin()?`<button class="btn" data-act="fb-out">Keluar</button>`:''}${!FBX?`<button class="btn" data-act="fb-retry">Coba hubungkan lagi</button>`:''}</div>
    <p class="mut sm" style="margin-top:14px">Hanya email yang tercantum di <code>firestore.rules</code> yang dianggap guru. Siswa tidak bisa menulis ke data guru.</p></div>
    <div class="card pad" style="margin-top:16px"><h2 style="margin-bottom:8px">Alamat portal siswa</h2><label class="fld"><span>Kosongkan untuk memakai alamat otomatis (${esc(portalBase())})</span><input type="url" id="portal-url" value="${esc(S.setting.portalUrl||'')}" placeholder="https://namaanda.github.io/jurnal/siswa.html"></label><div class="row" style="margin-top:10px"><button class="btn" data-act="portal-url-save">Simpan alamat</button></div></div>`;
  }else if(sub==='kode'){
    const sis=siswaOf(S.setting.kelas),tot=S.siswa.length,tk=S.siswa.filter(s=>s.kode).length;
    body=`<div class="card pad" style="margin-bottom:16px"><p><b>${tk}</b> dari <b>${tot}</b> siswa sudah punya kode. Kode berisi 8 karakter acak dan menjadi satu-satunya kunci siswa. Bagikan secara pribadi (per siswa), jangan di grup terbuka.</p>
    <div class="row" style="margin-top:12px"><button class="btn primary" data-act="kode-gen">Buat kode untuk siswa yang belum punya</button><button class="btn" data-act="kode-push">Aktifkan kode di Firebase</button><button class="btn" data-act="kode-xls">${ic('dl')} Unduh daftar kode (Excel)</button></div></div>
    <div class="card tw"><table class="tbl"><thead><tr><th>No</th><th>Nama</th><th>Kode</th><th></th></tr></thead><tbody>${sis.map((w,i)=>`<tr><td>${i+1}</td><td>${esc(w.nama)}</td><td><code>${esc(w.kode||'–')}</code></td><td>${w.kode?`<button class="btn sm" data-act="kode-copy" data-id="${w.id}">Salin tautan</button> <button class="btn sm" data-act="kode-regen" data-id="${w.id}">Kode baru</button>`:''}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">Belum ada siswa.</td></tr>'}</tbody></table></div>`;
  }else if(sub==='sinkron'){
    const cnt=(c,f)=>S[c].filter(f).length,k=S.setting.kelas;
    body=`<div class="grid2"><div class="card pad"><h2>1. Terbitkan ke siswa</h2><p class="mut" style="margin:6px 0 12px">Mengirim materi, tugas, soal ujian (tanpa kunci jawaban), dan absen yang dicentang "tampilkan di portal" untuk semua kelas.</p>
      <div class="chips" style="margin-bottom:12px"><span class="chip">${cnt('materi',x=>x.terbit)} materi</span><span class="chip">${cnt('tugas',x=>x.terbit)} tugas</span><span class="chip">${cnt('kuis',x=>x.terbit)} ujian</span><span class="chip">${cnt('sesi',x=>x.buka)} absen dibuka</span></div>
      <button class="btn primary" data-act="fb-publish">Terbitkan sekarang</button><p class="mut sm" style="margin-top:10px">Centang "Tampilkan di portal siswa" pada form materi, tugas, dan ujian; centang "Buka absen mandiri" pada pertemuan. Berkas unggahan tidak dikirim, gunakan tautan.</p></div>
    <div class="card pad"><h2>2. Ambil kiriman siswa</h2><p class="mut" style="margin:6px 0 12px">Menarik tugas yang dikumpulkan, absen mandiri, dan jawaban ujian. Jawaban ujian dikoreksi di sini memakai kunci Anda.</p><button class="btn primary" data-act="fb-pull">Ambil sekarang</button></div>
    <div class="card pad"><h2>3. Kirim nilai ke siswa</h2><p class="mut" style="margin:6px 0 12px">Setiap siswa hanya bisa melihat nilainya sendiri (semester ${S.setting.semester}).</p><button class="btn primary" data-act="fb-nilai">Kirim nilai</button></div></div>`;
  }else{
    body=`<div class="card pad"><h2 style="margin-bottom:6px">Cadangan data guru di Firebase</h2><p class="mut" style="margin-bottom:12px">Menyimpan seluruh data jurnal, absensi, dan nilai ke akun Firebase Anda, supaya aman bila peramban dibersihkan atau berganti perangkat. Berkas unggahan tidak ikut. ${S.setting.lastBackup?'Cadangan terakhir: <b>'+new Date(S.setting.lastBackup).toLocaleString('id-ID')+'</b>.':'Belum pernah dicadangkan.'}</p>
    <div class="row"><button class="btn primary" data-act="fb-backup">Cadangkan sekarang</button><button class="btn" data-act="fb-restore">Pulihkan dari cadangan</button></div></div>`;
  }
  return head+tabs+body;
}
Object.assign(ACT,{
  'fb-retry':()=>fbConnect(),
  'fb-google':async()=>{try{await FBX.auth.google()}catch(e){fbErr(e)}},
  'fb-email':()=>openModal({title:'Masuk sebagai guru',saveLabel:'Masuk',fields:[{k:'e',l:'Email',t:'text',req:1,w:'full'},{k:'p',l:'Kata sandi',t:'text',req:1,w:'full'}],onSave:async v=>{try{await FBX.auth.email(v.e,v.p)}catch(e){fbErr(e);return false}}}),
  'fb-out':async()=>{try{await FBX.auth.out()}catch(e){}},
  'portal-url-save':()=>{S.setting.portalUrl=$('#portal-url').value.trim();save();render();toast('Tersimpan','ok')},
  'kode-gen':()=>{let n=0;S.siswa.forEach(s=>{if(!s.kode){s.kode=kodeBaru();n++}});save();render();toast(n+' kode dibuat. Klik "Aktifkan kode di Firebase".','ok')},
  'kode-push':fbKodePush,
  'kode-regen':d=>ask('Buat kode baru untuk siswa ini?',async()=>{const s=byId(S.siswa,d.id),old=s.kode;s.kode=kodeBaru();save();if(FBX&&isGuruLogin()){try{await FBX.set('murid/'+s.kode,{sid:s.id,kelas:s.kelas,nama:s.nama});if(old)await FBX.del('murid/'+old)}catch(e){fbErr(e)}}render();toast('Kode baru dibuat','ok')},'Buat baru','Kode lama tidak berlaku lagi.'),
  'kode-copy':async d=>{const s=byId(S.siswa,d.id),ok=await copyAny(portalLink(s.kode));toast(ok?'Tautan siswa disalin':'Gagal menyalin',ok?'ok':'bad')},
  'kode-xls':()=>{if(!xlsxOK())return;const A=[['KELAS','NAMA','KODE','TAUTAN MASUK']];S.kelas.forEach(k=>siswaOf(k.id).forEach(w=>A.push([k.nama,w.nama,w.kode||'',w.kode?portalLink(w.kode):''])));const wb=XLSX.utils.book_new();sh(wb,'Kode siswa',A,[14,34,12,60]);xlsxSave(wb,'Kode_Siswa_Portal.xlsx')},
  'fb-publish':fbPublish,'fb-pull':fbPull,'fb-nilai':fbNilai,'fb-backup':fbBackup,'fb-restore':fbRestore
});

setTimeout(fbConnect,0);

</script>
</body>
</html>
